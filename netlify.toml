[build]
  publish = "."
  command = ""

[[headers]]
  for = "/live.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/kit/*"
  [headers.values]
    X-Robots-Tag = "noindex"
