name: Live data
# Refreshes live.json (scores, touchdowns, injuries, weather, official stats) on the "data" branch.
# The site reads it from there, so these updates never trigger a Netlify deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 13-23 * * 0,6'   # Sunday (and late-season Saturday) games, UTC
    - cron: '*/10 0-5 * * 0,1,2,5' # evening games that run past midnight UTC
    - cron: '*/10 22-23 * * 1,4'   # Monday and Thursday night kickoffs
    - cron: '23 */2 * * *'         # every 2 hours otherwise: injury reports, forecasts
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Previous data
        run: |
          curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/live.json?t=$(date +%s)" -o prev.json || cp live.json prev.json
      - name: Build
        run: python3 kit/live_action.py prev.json out
      - name: Publish to the data branch
        if: hashFiles('out/changed') != ''
        run: |
          if [ "$(cat out/changed)" != "yes" ]; then echo "No changes"; exit 0; fi
          mkdir pub && cp out/live.json pub/ && cd pub
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json && git commit -qm "Live data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
